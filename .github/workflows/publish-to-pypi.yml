name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build distribution
      run: python -m build

    - name: Verify distribution contents
      run: |
        echo "=== Source distribution contents ==="
        tar -tzf dist/fliq-*.tar.gz | grep -E '\.py$|py.typed' | head -20
        echo ""
        echo "=== Checking for test files (should be empty) ==="
        if tar -tzf dist/fliq-*.tar.gz | grep -q 'tests/'; then
          echo "ERROR: Test files found in distribution!"
          exit 1
        fi
        echo "✓ No test files in distribution"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: distributions
        path: dist/
