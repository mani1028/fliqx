name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build distribution
      run: python -m build

    - name: Verify distribution contents
      run: |
        echo "=== Source distribution contents ==="
        tar -tzf dist/fliqx-*.tar.gz | grep -E '\.py$|py.typed' | head -20
        echo ""
        echo "=== Checking for test files (should be empty) ==="
        if tar -tzf dist/fliqx-*.tar.gz | grep -q 'tests/'; then
          echo "ERROR: Test files found in distribution!"
          exit 1
        fi
        echo "✓ No test files in distribution"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distributions
        path: dist/
